# RemoteContainers v1.0.1

config-version: 1

# Logs a warning on Minecraft versions outside the currently advertised
# compatibility range. It does NOT prevent the plugin from loading.
warn-on-untested-version: true

# Maximum registered remote containers per player.
# Use 0 or a negative number for unlimited.
max-containers-per-player: 10

# Maximum distance for /rc create to find the container the player is looking at.
create-target-distance: 6

# Recommended for public servers.
# /rc create <name> selects the container you are looking at, then requires
# one real right-click on that same block before the link is saved.
#
# Because the confirmation uses a normal PlayerInteractEvent at MONITOR with
# ignoreCancelled=true, protection plugins get a chance to deny the physical
# interaction first. This prevents RemoteContainers from becoming an easy
# bypass for protected chests.
require-physical-confirmation: true
confirmation-timeout-seconds: 30

# If true, opening a remote container may synchronously load its chunk.
# If false, the command fails while that chunk is unloaded.
load-unloaded-chunks: true

# Prevent two different players from registering the same physical container.
allow-shared-links: false

# A small anti-spam cooldown for remote opening.
# Use 0 to disable.
open-cooldown-seconds: 1

# Names are case-insensitive internally.
names:
  min-length: 1
  max-length: 32
  allowed-regex: "^[A-Za-z0-9_-]+$"

# Any block whose BlockState implements InventoryHolder can be supported,
# but it must also be present in this allow-list.
supported-materials:
  - CHEST
  - TRAPPED_CHEST

  # Copper Chests were added in Minecraft 1.21.9.
  # On older supported versions these names are ignored automatically.
  - COPPER_CHEST
  - EXPOSED_COPPER_CHEST
  - WEATHERED_COPPER_CHEST
  - OXIDIZED_COPPER_CHEST
  - WAXED_COPPER_CHEST
  - WAXED_EXPOSED_COPPER_CHEST
  - WAXED_WEATHERED_COPPER_CHEST
  - WAXED_OXIDIZED_COPPER_CHEST

