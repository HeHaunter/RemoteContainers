name: Build

on:
  push:
  pull_request:

jobs:
  oldest-api:
    name: Java 21 / Spigot API 1.21
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build against oldest supported API
        run: mvn -B clean package

  modern-api:
    name: Java 25 / Spigot API ${{ matrix.api }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        api: [26.1, 26.2]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build against modern API
        run: mvn -B -Papi-${{ matrix.api }} clean package