name: Bug report
description: Report a reproducible problem with RemoteContainers
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please provide as much detail as possible. Compatibility information is especially important for RemoteContainers.

  - type: input
    id: plugin-version
    attributes:
      label: RemoteContainers version
      description: Which version of RemoteContainers are you using?
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: Which Minecraft server version are you running?
      placeholder: "26.2"
    validations:
      required: true

  - type: dropdown
    id: server-software
    attributes:
      label: Server software
      description: Which server implementation are you using?
      options:
        - CraftBukkit
        - Spigot
        - Paper
        - Other
    validations:
      required: true

  - type: input
    id: server-build
    attributes:
      label: Server build
      description: Include the exact server build if possible.
      placeholder: "Paper 26.2 build 129"
    validations:
      required: false

  - type: input
    id: java-version
    attributes:
      label: Java version
      description: Output of `java -version`, or just the major version if known.
      placeholder: "Java 25"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: "The remote inventory closes immediately when..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected the inventory to remain open..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give exact steps so the issue can be reproduced.
      placeholder: |
        1. Place a chest
        2. Run /rc create test
        3. Right-click the chest
        4. Move far away
        5. Run /rc open test
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Console errors or stack traces
      description: Paste any relevant console output here. If there are no errors, write "None".
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste any RemoteContainers config values that may be related to the issue.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Add screenshots, videos, other plugins involved, or anything else that may help.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I am using an official RemoteContainers release and have not modified the plugin JAR.
          required: true
        - label: I included enough information to reproduce the issue.
          required: true
